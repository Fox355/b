<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milkus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #040a10;
    --bg2: #0a1d2b;
    --card: rgba(255,255,255,.05);
    --card-hover: rgba(255,255,255,.12);
    --text: #f4f5ff;
    --muted: #8aa6bd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
    color: var(--text);
    font-family: "Manrope", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 20px;
  }
  body::before {
    content: ""; position: fixed; inset: -40px; z-index: -1;
    background: linear-gradient(rgba(4,10,16,.78), rgba(4,10,16,.92)), url("avatar.jpg") center / cover;
    filter: blur(28px) saturate(1.2);
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .avatar {
    width: 112px; height: 112px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: block;
    object-fit: cover;
    border: 3px solid rgba(91,184,255,.55);
    box-shadow: 0 0 34px rgba(60,150,255,.4);
  }
  h1 { font-size: 30px; font-weight: 800; margin: 0 0 28px; min-height: 1.3em; }
  .caret {
    display: inline-block; width: 3px; height: 1em;
    background: #5bb8ff; margin-left: 4px; vertical-align: -0.12em;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  p.bio { margin: 0 0 32px; color: var(--muted); font-size: 16px; line-height: 1.5; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.link {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;
    color: var(--text);
    text-decoration: none;
    text-align: left;
    font-weight: 600; font-size: 17px;
    backdrop-filter: blur(8px);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  a.link .icon {
    width: 42px; height: 42px; flex: none;
    border-radius: 12px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 18px; color: #fff;
  }
  a.link:hover, a.link:focus-visible {
    background: var(--card-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0,0,0,.3);
    outline: none;
  }
  a.link:focus-visible { box-shadow: 0 0 0 3px rgba(91,184,255,.7); }
  a.link small { font-weight: 400; font-size: 14px; color: var(--muted); margin-left: 6px; }
  .steam { background: linear-gradient(135deg,#2a475e,#1b6a9c); }
  .github { background: linear-gradient(135deg,#444c56,#22272e); }
  .discord { background: linear-gradient(135deg,#5865f2,#7983f5); }
  .spotify { background: linear-gradient(135deg,#1db954,#168f40); }
  @media (prefers-reduced-motion: reduce) { a.link { transition: none; } .caret { animation: none; } }
</style>
</head>
<body>
<main>
  <img class="avatar" src="avatar.jpg" alt="Аватар Milkus">
  <h1 id="nick" aria-label="Milkus">Milkus</h1>

  <ul>
    <!-- Замени href на свои ссылки. Строки можно копировать или удалять -->
    <li><a class="link" target="_blank" rel="noopener" href="https://steamcommunity.com/profiles/76561199204923344/"><span class="icon steam">S</span><span>Steam</span></a></li>
    <li><a class="link" href="#" id="discord" title="Скопировать ник"><span class="icon discord">D</span><span>Discord <small id="dc-hint">fox_1</small></span></a></li>
    <li><a class="link" target="_blank" rel="noopener" href="https://github.com/Fox355"><span class="icon github">G</span><span>GitHub</span></a></li>
    <li><a class="link" target="_blank" rel="noopener" href="https://open.spotify.com/user/31yf7r4trziymuznj3syai473joa"><span class="icon spotify">S</span><span>Spotify</span></a></li>
  </ul>
</main>
<script>
  // Печатающийся ник. Поменяй текст в NICK, если нужно
  const NICK = "Milkus";
  const el = document.getElementById("nick");
  const caret = '<span class="caret" aria-hidden="true"></span>';
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) {
    el.innerHTML = NICK + caret;
  } else {
    let i = 0;
    el.innerHTML = caret;
    setTimeout(function type() {
      i++;
      el.innerHTML = NICK.slice(0, i) + caret;
      if (i < NICK.length) setTimeout(type, 140 + Math.random() * 120);
    }, 500);
  }

  // Discord: по клику копируется ник
  const dc = document.getElementById("discord");
  const hint = document.getElementById("dc-hint");
  dc.addEventListener("click", function (e) {
    e.preventDefault();
    const done = function () {
      hint.textContent = "скопировано!";
      setTimeout(function () { hint.textContent = "fox_1"; }, 1600);
    };
    if (navigator.clipboard) navigator.clipboard.writeText("fox_1").then(done, done);
    else done();
  });
</script>
</body>
</html>
